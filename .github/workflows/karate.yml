name: Karate API Tests

# Se ejecuta a mano desde la pestaña Actions. Cuando pase en tu máquina y aquí,
# puedes agregar los disparadores de push y pull_request como en playwright.yml.
on:
  workflow_dispatch:

jobs:
  karate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: karate/pom.xml

      - name: Ejecutar pruebas de Karate
        run: mvn -B -f karate/pom.xml test

      - name: Subir reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: karate-report
          path: karate/target/karate-reports/
          retention-days: 14
